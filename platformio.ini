

[env:esp32-s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

; ==========================================
; 【存储模块配置】必须顶格写，不能放在 build_flags 里面！
; ==========================================
board_build.filesystem = littlefs
; 分区表固定在仓库内：双 OTA 各 2MB，LittleFS 3.875MB，FatFS 8M 总边界为 16MB。
board_build.partitions = partitions_n16r8.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
    h2zero/NimBLE-Arduino@^1.4.1
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit PN532

; esp32-s3-devkitc-1 默认注入 ARDUINO_USB_MODE=1，这里移除后改用 TinyUSB OTG。
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    -I src/bsp/includes
    -I src/hal/includes
    -I src/sys/includes
    -I src/apps/includes
    -I src/ui/includes
    -I src/lang/includes
    -D BOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DNO_GLOBAL_SERIAL
    -include sys/sys_usb_cdc_serial.h

    -D USER_SETUP_LOADED=1
    ; TFT_eSPI 现在只作为 Sprite/U8g2 画布依赖，物理 NV3007 由 BSP QSPI 驱动刷新。
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=428
    -D TFT_HEIGHT=142
    ;-D TERMINAL_LANG_ZH
    ;-D TERMINAL_LANG_EN
    -D TFT_INVERSION_OFF=1
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=3
    -D TOUCH_CS=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=40000000

    -D NV3007_SPI_FREQUENCY=60000000
    -D NV3007_INIT_SPI_FREQUENCY=40000000
    -D NV3007_RAM_SPI_FREQUENCY=60000000
    -D NV3007_TE_PHASE_US=6500
