[platformio]
; 普通 Build/Upload 不带 -e 时只处理正式固件，避免采集固件在第二次上传时覆盖正式固件。
; 需要脱线采集时必须显式选择 esp32-s3-imu-capture，不通过手工修改宏切换。
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32@6.5.0
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
; PlatformIO 6.5.0 自带的 esptool 4.5.1 不支持 ESP32-S3 USB-JTAG 的 watchdog 收尾复位。
; 固定使用 esptool 4.11.0，确保烧录结束后能从 ROM 下载模式回到应用固件。
platform_packages =
    tool-esptoolpy @ 2.41100.0

; 统一覆盖两种当前固件状态：
; 1. 正式固件的 TinyUSB CDC（VID 303A/PID 0002）响应 1200bps，并重新枚举为 ROM 端口；
; 2. 无 TinyUSB 的采集固件会忽略 1200bps，随后由 esptool 通过内建 USB-Serial/JTAG 执行 USB reset。
; 等待端口重枚举后仍执行 usb_reset，使两条入口最终都稳定落到 ROM 下载器。
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
board_upload.before_reset = usb_reset
; ESP32-S3 USB Serial/JTAG 不能用普通 RTS 收尾复位，使用 esptool 原生看门狗复位回到应用。
board_upload.after_reset = watchdog_reset

; ==========================================
; 【存储模块配置】必须顶格写，不能放在 build_flags 里面！
; ==========================================
board_build.filesystem = littlefs
; 分区表固定在仓库内：双 OTA 各 2MB，LittleFS 3.875MB，FatFS 8M 总边界为 16MB。
board_build.partitions = partitions_n16r8.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
    h2zero/NimBLE-Arduino@^1.4.1
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit PN532

; 官方 4D R8N16 板型默认启用 USB Serial/JTAG CDC；移除后由项目统一管理 TinyUSB OTG CDC/MSC。
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -I src/bsp/includes
    -I src/hal/includes
    -I src/sys/includes
    -I src/apps/includes
    -I src/ui/includes
    -I src/lang/includes
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DNO_GLOBAL_SERIAL
    -include sys/sys_usb_cdc_serial.h

    -D USER_SETUP_LOADED=1
    ; TFT_eSPI 现在只作为 Sprite/U8g2 画布依赖，物理 NV3007 由 BSP QSPI 驱动刷新。
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=428
    -D TFT_HEIGHT=142
    ;-D TERMINAL_LANG_ZH
    ;-D TERMINAL_LANG_EN
    -D TFT_INVERSION_OFF=1
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=3
    -D TOUCH_CS=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=40000000

    -D NV3007_SPI_FREQUENCY=60000000
    -D NV3007_INIT_SPI_FREQUENCY=40000000
    -D NV3007_RAM_SPI_FREQUENCY=60000000
    -D NV3007_TE_PHASE_US=6500

; ==========================================
; 【隔离IMU脱线采集固件】
; 使用独立环境避免手工修改主固件 build_flags。该固件不会启动正常APP；旋钮选择标签、主键开始，
; 数据写入 /Resources/_capture/imu。采集完成后重启并按住侧键，即可通过现有MSC导出。
; 本环境不会被默认上传选中；只有显式选择本环境时才启用采集入口。
; ==========================================
[env:esp32-s3-imu-capture]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -D PRESCRIPT_IMU_CAPTURE_TEST=1
